name: Go tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, relay, protocol, core/integrationtest, core/mobile]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - name: Verify Android gomobile binding
        if: matrix.module == 'core/mobile'
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261117202452-47699113848a
          export PATH="$(go env GOPATH)/bin:$PATH"
          go tool gomobile bind -androidapi=35 -target=android/arm64 -o "$RUNNER_TEMP/linko.aar" .

      - name: Run tests with race detector
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
