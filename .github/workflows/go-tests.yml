name: Go tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, relay, protocol, core/integrationtest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - name: Resolve integration test dependencies
        if: matrix.module == 'core/integrationtest'
        working-directory: core/integrationtest
        run: |
          go mod tidy
          echo '--- integrationtest go.mod ---'
          cat go.mod
          echo '--- integrationtest go.sum ---'
          cat go.sum

      - name: Run tests with race detector
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
