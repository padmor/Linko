name: Go tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, relay]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - name: Generate and display module checksums
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          echo "--- go.mod ---"
          cat go.mod
          echo "--- go.sum ---"
          if [ -f go.sum ]; then cat go.sum; else echo "(no external module checksums)"; fi

      - name: Run tests with race detector
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
