name: Android gateway

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - ".github/workflows/android-gateway.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - ".github/workflows/android-gateway.yml"

permissions:
  contents: read

jobs:
  gateway-library:
    name: Build Android gateway library
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Run gateway unit tests
        run: gradle -p android :gateway:testDebugUnitTest

      - name: Assemble gateway library
        run: gradle -p android :gateway:assembleDebug

  expo-android-app:
    name: Build Expo Android app with Linko gateway
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm install

      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.0.0"

      - name: Assemble Expo app
        run: gradle -p app/android assembleDebug
