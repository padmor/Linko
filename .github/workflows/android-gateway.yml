name: Android gateway

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "core/mobile/**"
      - "scripts/build-android-mobile.sh"
      - "app/**"
      - ".github/workflows/android-gateway.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "core/mobile/**"
      - "scripts/build-android-mobile.sh"
      - "app/**"
      - ".github/workflows/android-gateway.yml"

permissions:
  contents: read

jobs:
  gateway-library:
    name: Build Android gateway library
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/mobile/go.mod
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35"

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Go Android binding
        run: bash scripts/build-android-mobile.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Run gateway unit tests
        run: gradle -p android :gateway:testDebugUnitTest

      - name: Assemble gateway library
        run: gradle -p android :gateway:assembleDebug

  expo-android-app:
    name: Build Expo Android app with Linko gateway
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13"

      - name: Install app dependencies
        working-directory: app
        run: npm install

      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/mobile/go.mod
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35"

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Go Android binding
        run: bash scripts/build-android-mobile.sh

      - name: Assemble standalone Expo app
        working-directory: app/android
        run: ./gradlew assembleRelease

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: linko-android-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
